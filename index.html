<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة انتظار المراجع - مركز صحي العمران للرعاية الأولية</title>
    
    <!-- إعدادات PWA لتشغيله كبرنامج مستقل -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: white;
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 30px;
        }

        /* الهيدر: الشعار في أقصى اليمين، واسم المركز في أقصى اليسار */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-bottom: 12px;
            border-bottom: 2px solid #1e293b;
        }
        .cluster-logo {
            height: 90px;
            width: auto;
            object-fit: contain;
            background: transparent;
        }
        .center-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffc107;
            text-align: left;
        }

        /* محتوى شاشة المراجع */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .display-box {
            background: #151c2c;
            border: 2px solid #2a344d;
            border-radius: 25px;
            padding: 50px 40px;
            text-align: center;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            margin-bottom: 25px;
        }

        .display-number {
            font-size: 6rem;
            font-weight: bold;
            color: #ffc107;
            margin-bottom: 15px;
            line-height: 1.1;
            word-break: break-all;
        }

        .msg-primary {
            font-size: 2.2rem;
            color: #ffffff;
            font-weight: bold;
            margin-top: 15px;
        }

        .msg-secondary {
            font-size: 1.4rem;
            color: #38bdf8;
            margin-top: 10px;
            font-weight: bold;
        }

        /* شاشة التفعيل الأولية لتشغيل الصوتيات بالمتصفح */
        #activationOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(7, 10, 17, 0.96);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        /* تأثيرات الوميض والاهتزاز عند حلول الدور */
        @keyframes flashAlert {
            0% { background-color: #151c2c; border-color: #d9534f; }
            50% { background-color: #451a1a; border-color: #d9534f; }
            100% { background-color: #151c2c; border-color: #d9534f; }
        }
        @keyframes shakeAlert {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, -1px) rotate(1deg); }
            40% { transform: translate(3px, 0px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(2px, -1px) rotate(-1deg); }
            100% { transform: translate(2px, 1px) rotate(0deg); }
        }
        .alert-active {
            animation: flashAlert 0.8s infinite, shakeAlert 0.4s infinite;
        }
        .alert-active .display-number {
            color: #ff6b6b;
        }

        .btn-stop {
            display: none;
            margin-top: 25px;
            padding: 14px 40px;
            font-size: 1.2rem;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(217, 83, 79, 0.4);
            transition: 0.3s;
        }
        .btn-stop:hover {
            background-color: #c9302c;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <!-- مكتبة الاتصال اللحظي MQTT -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <!-- نافذة التفعيل الإجبارية لتشغيل التنبيهات الصوتية في الجوال -->
    <div id="activationOverlay">
        <div class="text-center bg-dark p-4 rounded-4 shadow-lg border border-secondary" style="max-width: 450px;">
            <h3 class="text-warning fw-bold mb-3">شاشة متابعة دور المراجع</h3>
            <p class="text-light mb-4 small">اضغط الزر أدناه لتفعيل التنبيهات الصوتية والربط المباشر مع نظام النداء</p>
            <button class="btn btn-warning btn-lg fw-bold px-4 py-3 rounded-pill w-100" onclick="activateSystem()">تفعيل النظام وبدء الاستماع 🔊</button>
        </div>
    </div>

    <!-- الهيدر: الشعار يمين واسم المركز يسار -->
    <div class="header">
        <div class="logo-container">
            <img src="https://github.com/blu2ris-create/clinic-queue-system/blob/main/logo.png%20(2).png?raw=true" alt="شعار تجمع الأحساء الصحي" class="cluster-logo">
        </div>
        <div class="center-title">مركز صحي العمران للرعاية الأولية</div>
    </div>

    <!-- محتوى الشاشة -->
    <div class="main-content">
        <div class="display-box" id="mainContainer">
            <div class="display-number" id="currentNumber">جاري الانتظار...</div>
            <div class="msg-primary" id="msgPrimary">اسم الله عليك ما تشوف شر</div>
            <div class="msg-secondary" id="msgSecondary">اشغل وقتك بالدعاء لين ما يجي دورك</div>
        </div>
        
        <button class="btn-stop" id="stopBtn" onclick="stopAlert()">فهمت / إيقاف التنبيه</button>
    </div>

    <script>
        // إعدادات الاتصال المباشر بنظام النداء
        const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
        const uniqueTopic = 'umran_health_cluster_ksa_2026_secure_calls';
        const clientId = 'client_reviewer_' + Math.random().toString(16).substr(2, 8);
        const client = mqtt.connect(brokerUrl, { clientId: clientId });

        const airportChimeSound = new Audio('https://github.com/blu2ris-create/clinic-queue-system/raw/refs/heads/main/mixkit-melodic-airport-announcement-ding-1570.mp3');
        airportChimeSound.volume = 1.0;

        client.on('connect', () => {
            client.subscribe(uniqueTopic);
        });

        client.on('message', (topic, message) => {
            if (topic === uniqueTopic) {
                try {
                    const data = JSON.parse(message.toString());
                    triggerYourTurn(data.name, data.clinic);
                } catch (e) {}
            }
        });

        function activateSystem() {
            document.getElementById('activationOverlay').style.display = 'none';
            // تشغيل صوت صامت لتجاوز قيود المتصفح للأجهزة الذكية
            airportChimeSound.play().then(() => {
                airportChimeSound.pause();
                airportChimeSound.currentTime = 0;
            }).catch(e => {});
        }

        function triggerYourTurn(patientName, clinicName) {
            const container = document.getElementById('mainContainer');
            const numBox = document.getElementById('currentNumber');
            const msgP = document.getElementById('msgPrimary');
            const msgS = document.getElementById('msgSecondary');
            const stopBtn = document.getElementById('stopBtn');

            numBox.innerText = patientName;
            msgP.innerText = "حياك الله، وصل دورك للتو!";
            msgS.innerText = `التوجه إلى: ${clinicName}`;
            
            container.classList.add('alert-active');
            stopBtn.style.display = 'inline-block';
            
            // تشغيل النغمة التنبيهية
            try {
                airportChimeSound.currentTime = 0;
                airportChimeSound.play().catch(e => {});
            } catch(e) {}

            // اهتزاز الهاتف
            if (navigator.vibrate) {
                navigator.vibrate([1000, 500, 1000, 500, 1000]);
            }
        }

        function stopAlert() {
            const container = document.getElementById('mainContainer');
            const stopBtn = document.getElementById('stopBtn');
            container.classList.remove('alert-active');
            stopBtn.style.display = 'none';
        }
    </script>

</body>
</html>
