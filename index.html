<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>شاشة المراجع - مركز صحي الصالحية</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #0b0f19;
            color: white;
            font-family: 'Cairo', sans-serif;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: env(safe-area-inset-top, 15px) 15px env(safe-area-inset-bottom, 15px) 15px;
        }

        .app-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            flex-shrink: 0;
        }
        .cluster-logo {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .center-heading {
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            font-weight: bold;
            color: #ffc107;
            text-align: center;
            letter-spacing: 0.5px;
            width: 100%;
            margin-top: 10px;
        }

        .main-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px 0;
        }

        .display-box {
            background: #151c2c;
            border: 2px solid #2a344d;
            border-radius: 24px;
            padding: 30px 15px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .display-number {
            font-size: clamp(3.5rem, 15vw, 5.5rem);
            font-weight: bold;
            color: #ffc107;
            line-height: 1.1;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .msg-primary {
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .msg-secondary {
            font-size: clamp(0.95rem, 4vw, 1.15rem);
            color: #38bdf8;
            font-weight: bold;
        }

        .btn-stop {
            display: none;
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 1.1rem;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(217, 83, 79, 0.4);
            transition: 0.3s;
        }

        #activationOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: #0b0f19;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .welcome-card {
            background: #151c2c;
            border: 2px solid #2a344d;
            padding: 25px 20px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        .user-input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            text-align: center;
            background: #0b0f19;
            border: 2px solid #38bdf8;
            color: white;
            border-radius: 12px;
            margin-bottom: 15px;
            outline: none;
        }
        .user-input:focus {
            border-color: #ffc107;
        }

        @keyframes flashAlert {
            0% { background-color: #151c2c; border-color: #d9534f; }
            50% { background-color: #451a1a; border-color: #d9534f; }
            100% { background-color: #151c2c; border-color: #d9534f; }
        }
        @keyframes shakeAlert {
            0% { transform: translate(2px, 1px); }
            20% { transform: translate(-2px, -1px); }
            40% { transform: translate(3px, 0px); }
            60% { transform: translate(-3px, 1px); }
            100% { transform: translate(2px, 1px); }
        }
        .alert-active {
            animation: flashAlert 0.8s infinite, shakeAlert 0.4s infinite;
        }
        .alert-active .display-number {
            color: #ff6b6b;
        }

        .footer-note {
            font-size: 0.75rem;
            color: #475569;
            text-align: center;
            flex-shrink: 0;
            padding-bottom: 5px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <div id="activationOverlay">
        <div class="welcome-card">
            <h3 style="color: #ffc107; font-weight: bold; margin-bottom: 5px; font-size: 1.2rem;">مركز صحي الصالحية</h3>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; line-height: 1.4;">أدخل رقم التذكرة الخاص بك لكي يصلك النداء الصوتي والاهتزاز:</p>
            <input type="number" id="patientIdentifier" class="user-input" placeholder="مثال: 46" autocomplete="off">
            <button onclick="activateSystem()" style="background: #ffc107; color: #0b0f19; border: none; padding: 14px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 14px; width: 100%; cursor: pointer; box-shadow: 0 5px 15px rgba(255,193,7,0.3);">بدء المتابعة وتفعيل النظام 🚀</button>
        </div>
    </div>

    <div class="app-header">
        <div style="width: 50px;"></div>
        <div class="center-heading">مركز صحي الصالحية</div>
        <img src="https://github.com/blu2ris-create/clinic-queue-system/blob/main/logo.png%20(2).png?raw=true" alt="شعار التجمع" class="cluster-logo">
    </div>

    <div class="main-container">
        <div class="display-box" id="mainContainer">
            <div class="display-number" id="currentNumber">--</div>
            <div class="msg-primary" id="msgPrimary">في الانتظار...</div>
            <div class="msg-secondary" id="msgSecondary">رقمك المسجل: <span id="myTagDisplay" style="color: #ffc107;">--</span></div>
        </div>
        <button class="btn-stop" id="stopBtn" onclick="stopAlert()">فهمت / إيقاف التنبيه</button>
    </div>

    <div class="footer-note">نظام النداء الآلي © 2026</div>

    <script>
        const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
        const uniqueTopic = 'umran_health_cluster_ksa_2026_secure_calls';
        const clientId = 'client_reviewer_' + Math.random().toString(16).substr(2, 8);
        const client = mqtt.connect(brokerUrl, { clientId: clientId });

        const voicesBaseUrl = "https://raw.githubusercontent.com/blu2ris-create/health-cluster-audio/main/voices/";
        
        let myRegisteredNumber = "";
        let audioCtx = null;
        let audioBufferCache = {};
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        client.on('connect', () => {
            client.subscribe(uniqueTopic);
        });

        client.on('message', (topic, message) => {
            if (topic === uniqueTopic) {
                try {
                    const data = JSON.parse(message.toString());
                    const calledNum = String(data.patientNumber || '').trim();
                    const myNum = String(myRegisteredNumber).trim();

                    if (myNum && calledNum === myNum) {
                        triggerYourTurn(data);
                    }
                } catch (e) {}
            }
        });

        function activateSystem() {
            const inputVal = document.getElementById('patientIdentifier').value.trim();
            if (!inputVal) {
                alert('الرجاء إدخال رقم التذكرة أولاً');
                return;
            }

            myRegisteredNumber = inputVal;
            document.getElementById('myTagDisplay').innerText = myRegisteredNumber;
            
            // إخفاء شاشة الترحيب بشكل فوري ومباشر
            const overlay = document.getElementById('activationOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
            
            requestWakeLock();

            // تهيئة الصوت بشكل آمن لا يتسبب في تجميد الصفحة
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}

            if ("vibrate" in navigator) {
                try { navigator.vibrate(200); } catch(e) {}
            }

            preloadAudioBuffers(["ding.mp3", "please_wait.mp3", "goto.mp3"]);
        }

        function trimSilence(buffer) {
            const channel = buffer.getChannelData(0);
            const threshold = 0.02;
            let startIdx = 0;
            let endIdx = channel.length - 1;

            for (let i = 0; i < channel.length; i++) {
                if (Math.abs(channel[i]) > threshold) {
                    startIdx = Math.max(0, i - 10);
                    break;
                }
            }
            for (let i = channel.length - 1; i >= 0; i--) {
                if (Math.abs(channel[i]) > threshold) {
                    endIdx = Math.min(channel.length - 1, i + 10);
                    break;
                }
            }
            if (startIdx >= endIdx) return buffer;

            const newBuffer = audioCtx.createBuffer(buffer.numberOfChannels, endIdx - startIdx, buffer.sampleRate);
            for (let c = 0; c < buffer.numberOfChannels; c++) {
                const oldData = buffer.getChannelData(c);
                const newData = newBuffer.getChannelData(c);
                for (let i = 0; i < newBuffer.length; i++) {
                    newData[i] = oldData[startIdx + i];
                }
            }
            return newBuffer;
        }

        async function loadAudioBuffer(fileName) {
            if (audioBufferCache[fileName]) return audioBufferCache[fileName];
            try {
                const response = await fetch(voicesBaseUrl + fileName);
                const arrayBuffer = await response.arrayBuffer();
                let decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                decodedBuffer = trimSilence(decodedBuffer);
                audioBufferCache[fileName] = decodedBuffer;
                return decodedBuffer;
            } catch (e) {
                return null;
            }
        }

        async function preloadAudioBuffers(fileNames) {
            for (const file of fileNames) {
                await loadAudioBuffer(file);
            }
        }

        async function playMergedSequence(fileList) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            let loadedBuffers = [];
            let totalLength = 0;
            let sampleRate = audioCtx.sampleRate;
            let numberOfChannels = 1;

            for (const file of fileList) {
                let buffer = await loadAudioBuffer(file);
                if (buffer) {
                    loadedBuffers.push(buffer);
                    totalLength += buffer.length;
                    sampleRate = buffer.sampleRate;
                    numberOfChannels = Math.max(numberOfChannels, buffer.numberOfChannels);
                }
            }

            if (loadedBuffers.length === 0) return;

            const masterBuffer = audioCtx.createBuffer(numberOfChannels, totalLength, sampleRate);
            for (let c = 0; c < numberOfChannels; c++) {
                const masterData = masterBuffer.getChannelData(c);
                let offset = 0;
                for (const buf of loadedBuffers) {
                    const sourceData = buf.getChannelData(c % buf.numberOfChannels);
                    masterData.set(sourceData, offset);
                    offset += buf.length;
                }
            }

            const source = audioCtx.createBufferSource();
            source.buffer = masterBuffer;
            source.connect(audioCtx.destination);
            source.start(0);
        }

        async function triggerYourTurn(data) {
            const container = document.getElementById('mainContainer');
            const numBox = document.getElementById('currentNumber');
            const msgP = document.getElementById('msgPrimary');
            const msgS = document.getElementById('msgSecondary');
            const stopBtn = document.getElementById('stopBtn');

            numBox.innerText = data.patientNumber;
            msgP.innerText = "وصل دورك تفضل";
            msgS.innerText = `التوجه إلى: ${data.clinicName}`;
            
            container.classList.add('alert-active');
            stopBtn.style.display = 'inline-block';
            
            try {
                const patientAudio = data.patientAudioFile || (data.patientNumber + '.mp3');
                const clinicAudio = data.clinicAudioFile || 'lab.mp3';

                await preloadAudioBuffers([patientAudio, clinicAudio]);

                const sequence = [
                    "ding.mp3",
                    "please_wait.mp3",
                    patientAudio,
                    "goto.mp3",
                    clinicAudio
                ];

                await playMergedSequence(sequence);
            } catch(e) {}

            if ("vibrate" in navigator) {
                try {
                    navigator.vibrate([500, 300, 500, 300, 500, 300, 800]);
                } catch(e) {}
            }
        }

        function stopAlert() {
            const container = document.getElementById('mainContainer');
            const stopBtn = document.getElementById('stopBtn');
            container.classList.remove('alert-active');
            stopBtn.style.display = 'none';
        }
    </script>
</body>
</html>
