<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>شاشة انتظار المراجع - مركز صحي العمران للرعاية الأولية</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #0b0f19;
            color: white;
            font-family: 'Cairo', sans-serif;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: env(safe-area-inset-top, 10px) 15px env(safe-area-inset-bottom, 10px) 15px;
        }

        .app-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(21, 28, 44, 0.7);
            border-radius: 16px;
            border: 1px solid rgba(42, 52, 77, 0.5);
            flex-shrink: 0;
        }
        .cluster-logo {
            height: 50px;
            width: auto;
            object-fit: contain;
        }
        .center-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffc107;
            text-align: left;
            line-height: 1.2;
        }
        .center-title span {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .main-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px 0;
        }

        .display-box {
            background: #151c2c;
            border: 2px solid #2a344d;
            border-radius: 24px;
            padding: 25px 15px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .display-number {
            font-size: clamp(3.5rem, 15vw, 5.5rem);
            font-weight: bold;
            color: #ffc107;
            line-height: 1.1;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .msg-primary {
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .msg-secondary {
            font-size: clamp(0.95rem, 4vw, 1.15rem);
            color: #38bdf8;
            font-weight: bold;
        }

        .btn-stop {
            display: none;
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 1.1rem;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(217, 83, 79, 0.4);
            transition: 0.3s;
        }

        #activationOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: #0b0f19;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .welcome-card {
            background: #151c2c;
            border: 2px solid #2a344d;
            padding: 25px 20px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        .user-input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            text-align: center;
            background: #0b0f19;
            border: 2px solid #38bdf8;
            color: white;
            border-radius: 12px;
            margin-bottom: 15px;
            outline: none;
        }
        .user-input:focus {
            border-color: #ffc107;
        }

        @keyframes flashAlert {
            0% { background-color: #151c2c; border-color: #d9534f; }
            50% { background-color: #451a1a; border-color: #d9534f; }
            100% { background-color: #151c2c; border-color: #d9534f; }
        }
        @keyframes shakeAlert {
            0% { transform: translate(2px, 1px); }
            20% { transform: translate(-2px, -1px); }
            40% { transform: translate(3px, 0px); }
            60% { transform: translate(-3px, 1px); }
            100% { transform: translate(2px, 1px); }
        }
        .alert-active {
            animation: flashAlert 0.8s infinite, shakeAlert 0.4s infinite;
        }
        .alert-active .display-number {
            color: #ff6b6b;
        }

        .footer-note {
            font-size: 0.75rem;
            color: #475569;
            text-align: center;
            flex-shrink: 0;
            padding-bottom: 5px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <div id="activationOverlay">
        <div class="welcome-card">
            <h3 style="color: #ffc107; font-weight: bold; margin-bottom: 10px; font-size: 1.3rem;">تسجيل تذكرة المراجع</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4;">أدخل رقم أو اسم التذكرة الخاص بك لكي يصلك التنبيه والاهتزاز:</p>
            <input type="text" id="patientIdentifier" class="user-input" placeholder="مثال: A-101 أو أحمد" autocomplete="off">
            <button onclick="activateSystem()" style="background: #ffc107; color: #0b0f19; border: none; padding: 14px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 14px; width: 100%; cursor: pointer; box-shadow: 0 5px 15px rgba(255,193,7,0.3);">بدء المتابعة وتفعيل التنبيه 🚀</button>
        </div>
    </div>

    <div class="app-header">
        <img src="https://github.com/blu2ris-create/clinic-queue-system/blob/main/logo.png%20(2).png?raw=true" alt="شعار التجمع" class="cluster-logo">
        <div class="center-title">مركز صحي العمران<br><span>للرعاية الأولية</span></div>
    </div>

    <div class="main-container">
        <div class="display-box" id="mainContainer">
            <div class="display-number" id="currentNumber">--</div>
            <div class="msg-primary" id="msgPrimary">في الانتظار...</div>
            <div class="msg-secondary" id="msgSecondary">رقمك المسجل: <span id="myTagDisplay" style="color: #ffc107;">--</span></div>
        </div>
        <button class="btn-stop" id="stopBtn" onclick="stopAlert()">فهمت / إيقاف التنبيه</button>
    </div>

    <div class="footer-note">نظام النداء الآلي © 2026</div>

    <script>
        const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
        const uniqueTopic = 'umran_health_cluster_ksa_2026_secure_calls';
        const clientId = 'client_reviewer_' + Math.random().toString(16).substr(2, 8);
        const client = mqtt.connect(brokerUrl, { clientId: clientId });

        const airportChimeSound = new Audio('https://github.com/blu2ris-create/clinic-queue-system/raw/refs/heads/main/mixkit-melodic-airport-announcement-ding-1570.mp3');
        airportChimeSound.volume = 1.0;

        let myRegisteredNumber = "";
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        client.on('connect', () => {
            client.subscribe(uniqueTopic);
        });

        client.on('message', (topic, message) => {
            if (topic === uniqueTopic) {
                try {
                    const data = JSON.parse(message.toString());
                    const calledNum = String(data.name).trim().toLowerCase();
                    const myNum = String(myRegisteredNumber).trim().toLowerCase();

                    if (myNum && calledNum === myNum) {
                        triggerYourTurn(data.name, data.clinic);
                    }
                } catch (e) {}
            }
        });

        function activateSystem() {
            const inputVal = document.getElementById('patientIdentifier').value.trim();
            if (!inputVal) {
                alert('الرجاء إدخال رقم أو اسم التذكرة أولاً');
                return;
            }

            myRegisteredNumber = inputVal;
            document.getElementById('myTagDisplay').innerText = myRegisteredNumber;
            document.getElementById('activationOverlay').style.display = 'none';
            
            requestWakeLock();

            // اهتزاز تجريبي بسيط لحظة الضغط على زر التفعيل لتأكيد عمل الهزاز في الجهاز
            if ("vibrate" in navigator) {
                try { navigator.vibrate(200); } catch(e) {}
            }

            airportChimeSound.play().then(() => {
                airportChimeSound.pause();
                airportChimeSound.currentTime = 0;
            }).catch(e => {});
        }

        function triggerYourTurn(patientName, clinicName) {
            const container = document.getElementById('mainContainer');
            const numBox = document.getElementById('currentNumber');
            const msgP = document.getElementById('msgPrimary');
            const msgS = document.getElementById('msgSecondary');
            const stopBtn = document.getElementById('stopBtn');

            numBox.innerText = patientName;
            msgP.innerText = "وصل دورك تفضل";
            msgS.innerText = `العيادة: ${clinicName}`;
            
            container.classList.add('alert-active');
            stopBtn.style.display = 'inline-block';
            
            try {
                airportChimeSound.currentTime = 0;
                airportChimeSound.play().catch(e => {});
            } catch(e) {}

            // تشغيل الاهتزاز الحقيقي للجوال بشكل متكرر
            if ("vibrate" in navigator) {
                try {
                    navigator.vibrate([500, 300, 500, 300, 500, 300, 800]);
                } catch(e) {}
            }
        }

        function stopAlert() {
            const container = document.getElementById('mainContainer');
            const stopBtn = document.getElementById('stopBtn');
            container.classList.remove('alert-active');
            stopBtn.style.display = 'none';
        }
    </script>
</body>
</html>
