<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة انتظار المراجع - تجمع الأحساء الصحي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #006643;
            font-size: 28px;
        }
        .ticket-box {
            font-size: 60px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            padding: 20px;
            background: #e9f5f0;
            border-radius: 10px;
        }
        .message {
            font-size: 22px;
            color: #d9534f;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تجمع الأحساء الصحي</h1>
        <h3>نظام إدارة صفوف العيادات</h3>
        <div class="ticket-box" id="currentNumber">جاري الانتظار...</div>
        <div class="message">اسم الله عليك ما تشوف شر</div>
    </div>

</body>
</html>
