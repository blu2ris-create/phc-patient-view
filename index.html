<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة انتظار المراجع - تجمع الأحساء الصحي</title>
    
    <!-- إعدادات PWA لتشغيله كبرنامج مستقل -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#006643">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            direction: rtl;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* الهيدر: الشعار في أقصى اليمين والعنوان في أقصى اليسار/الوسط حسب التنسيق المطلوب */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #ffffff;
            border-bottom: 3px solid #006643;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .logo-container img {
            height: 60px;
        }
        .center-title {
            font-size: 28px;
            font-weight: bold;
            color: #006643;
        }
        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid #e0e0e0;
        }
        .ticket-box {
            font-size: 70px;
            font-weight: bold;
            color: #006643;
            margin: 40px 0;
            padding: 35px;
            background: #e9f5f0;
            border-radius: 14px;
            letter-spacing: 3px;
        }
        .msg-primary {
            font-size: 26px;
            color: #333;
            font-weight: bold;
            margin-top: 30px;
        }
        .msg-secondary {
            font-size: 20px;
            color: #777;
            margin-top: 15px;
            font-weight: 500;
        }
        /* تأثيرات الوميض والاهتزاز عند حلول الدور */
        @keyframes flashAlert {
            0% { background-color: white; border-color: #d9534f; }
            50% { background-color: #fde8e8; border-color: #d9534f; }
            100% { background-color: white; border-color: #d9534f; }
        }
        @keyframes shakeAlert {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, -1px) rotate(1deg); }
            40% { transform: translate(3px, 0px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(2px, -1px) rotate(-1deg); }
            100% { transform: translate(2px, 1px) rotate(0deg); }
        }
        .alert-active {
            animation: flashAlert 0.8s infinite, shakeAlert 0.4s infinite;
        }
        .alert-active .ticket-box {
            background-color: #d9534f;
            color: white;
        }
        .btn-stop {
            display: none;
            margin-top: 40px;
            padding: 16px 40px;
            font-size: 20px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(217, 83, 79, 0.4);
            transition: background 0.3s;
        }
        .btn-stop:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

    <!-- الهيدر بالشعار الصحيح والعنوان -->
    <div class="header">
        <div class="logo-container">
            <img src="https://github.com/blu2ris-create/clinic-queue-system/blob/main/logo.png%20(2).png?raw=true" alt="شعار تجمع الأحساء الصحي">
        </div>
        <div class="center-title">مركز الرعاية الصحية الأولية</div>
    </div>

    <!-- محتوى الصفحة -->
    <div class="main-content">
        <div class="container" id="mainContainer">
            <div class="ticket-box" id="currentNumber">جاري الانتظار...</div>
            <div class="msg-primary" id="msgPrimary">اسم الله عليك ما تشوف شر</div>
            <div class="msg-secondary" id="msgSecondary">اشغل وقتك بالدعاء لين ما يجي دورك</div>
            
            <button class="btn-stop" id="stopBtn" onclick="stopAlert()">فهمت / إيقاف التنبيه</button>
        </div>
    </div>

    <script>
        function triggerYourTurn(ticketNumber) {
            const container = document.getElementById('mainContainer');
            const numBox = document.getElementById('currentNumber');
            const msgP = document.getElementById('msgPrimary');
            const msgS = document.getElementById('msgSecondary');
            const stopBtn = document.getElementById('stopBtn');

            numBox.innerText = ticketNumber;
            msgP.innerText = "حياك الله، وصل دورك للتو!";
            msgS.innerText = "الرجاء التوجه إلى العيادة المطلوبة فوراً";
            
            container.classList.add('alert-active');
            stopBtn.style.display = 'inline-block';
            if (navigator.vibrate) navigator.vibrate([800, 400, 800, 400, 800]);
        }

        function stopAlert() {
            const container = document.getElementById('mainContainer');
            const stopBtn = document.getElementById('stopBtn');
            container.classList.remove('alert-active');
            stopBtn.style.display = 'none';
        }
    </script>

</body>
</html>
